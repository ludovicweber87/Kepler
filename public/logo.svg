<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="d-grad" x1="0" y1="0" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="62" y1="20" x2="260" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="node-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- D shape - vertical bar as circuit trace -->
  <line x1="10" y1="8" x2="10" y2="56" stroke="url(#d-grad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- D curve - angular PCB-style segments -->
  <polyline points="10,8 22,8 38,16 44,28 44,36 38,48 22,56 10,56" stroke="url(#d-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Circuit branches from the D -->
  <line x1="10" y1="22" x2="4" y2="22" stroke="#7C5CFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="42" x2="4" y2="42" stroke="#00B8D9" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="52" y2="32" stroke="#00D4FF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38" y1="16" x2="46" y2="10" stroke="#9A84FF" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="48" x2="46" y2="54" stroke="#00C4EF" stroke-width="1" stroke-linecap="round"/>

  <!-- Circuit nodes (connection points) with glow -->
  <g filter="url(#node-glow)">
    <!-- Nodes on the vertical bar -->
    <circle cx="10" cy="8" r="2.5" fill="#7C5CFF"/>
    <circle cx="10" cy="22" r="2" fill="#8E72FF"/>
    <circle cx="10" cy="42" r="2" fill="#00C4EF"/>
    <circle cx="10" cy="56" r="2.5" fill="#00D4FF"/>

    <!-- Nodes on the curve -->
    <circle cx="22" cy="8" r="1.8" fill="#7C5CFF"/>
    <circle cx="38" cy="16" r="1.8" fill="#8E72FF"/>
    <circle cx="44" cy="28" r="1.8" fill="#00B8D9"/>
    <circle cx="44" cy="36" r="1.8" fill="#00C4EF"/>
    <circle cx="38" cy="48" r="1.8" fill="#00D4FF"/>
    <circle cx="22" cy="56" r="1.8" fill="#00D4FF"/>

    <!-- Nodes at branch endpoints -->
    <circle cx="4" cy="22" r="1.5" fill="#7C5CFF"/>
    <circle cx="4" cy="42" r="1.5" fill="#00B8D9"/>
    <circle cx="52" cy="32" r="1.5" fill="#00D4FF"/>
    <circle cx="46" cy="10" r="1.3" fill="#9A84FF"/>
    <circle cx="46" cy="54" r="1.3" fill="#00C4EF"/>
  </g>

  <!-- Inner horizontal circuit traces (inside the D) -->
  <line x1="10" y1="32" x2="36" y2="32" stroke="url(#d-grad)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="16" y1="22" x2="32" y2="22" stroke="#8E72FF" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
  <line x1="16" y1="42" x2="32" y2="42" stroke="#00C4EF" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>

  <!-- Devora text -->
  <text x="62" y="42" fill="url(#text-grad)" font-family="Poppins, system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5">Devora</text>
</svg>
